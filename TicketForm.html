<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certification - Create Ticket</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #fdf6f9, #f3e8f0);
      margin: 0;
      padding: 30px;
      color: #1a1a1a;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #d0006f;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
    }

    .ticket {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 50px;
      box-shadow: 0 10px 30px rgba(208, 0, 111, 0.2), 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .theme {
      background: #fafafa;
      border-left: 6px solid #d0006f;
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.07);
    }

    .theme input.theme-title {
      font-weight: bold;
      font-size: 17px;
      border: none;
      background: transparent;
      margin-bottom: 12px;
      width: 100%;
      color: #333;
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
    }

    .question {
      margin-top: 12px;
      padding: 14px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e1e1e1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    button {
      background-color: #d0006f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 10px rgba(208, 0, 111, 0.25);
      transition: background-color 0.2s, transform 0.2s;
    }

    button:hover {
      background-color: #ad005d;
      transform: translateY(-2px);
    }

    .save-btn {
      display: block;
      margin: 0 auto 30px auto;
      padding: 14px 22px;
      background-color: #4CAF50;
      color: white;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      box-shadow: 0 8px 16px rgba(76, 175, 80, 0.3);
      transition: transform 0.2s;
    }

    .save-btn:hover {
      transform: translateY(-2px);
    }

    .add-btn {
      background-color: #555;
      box-shadow: 0 4px 10px rgba(85, 85, 85, 0.3);
    }
  </style>
</head>
<body>
  <h1>Create Certification Ticket</h1>
  <button class="save-btn" onclick="saveTicket()">Save Ticket</button>

  <div id="ticket-container">
    <div class="ticket">
      <h2>Ticket</h2>
      <input type="text" id="category" placeholder="Category / Skill">
      <div id="themes-container"></div>
      <button class="add-btn" onclick="addTheme()">+ Add Theme</button>
    </div>
  </div>

  <script>
    const themesContainer = document.getElementById('themes-container');

    function addTheme() {
      const theme = document.createElement('div');
      theme.className = 'theme';

      const themeTitle = document.createElement('input');
      themeTitle.className = 'theme-title';
      themeTitle.placeholder = `Theme (Enter theme name)`;
      theme.appendChild(themeTitle);

      addQuestionBlock(theme);

      const addQuestionBtn = document.createElement('button');
      addQuestionBtn.className = 'add-btn';
      addQuestionBtn.textContent = '+ Add Question';
      addQuestionBtn.onclick = () => addQuestionBlock(theme);
      theme.appendChild(addQuestionBtn);

      themesContainer.appendChild(theme);
    }

    function addQuestionBlock(themeElem) {
      const questions = themeElem.querySelectorAll('.question');
      const question = document.createElement('div');
      question.className = 'question';
      question.innerHTML = `
        <label>Question ${questions.length + 1}</label>
        <textarea rows="2" placeholder="Question..."></textarea>
        <label>Answer</label>
        <textarea rows="3" placeholder="Correct answer..."></textarea>
      `;
      themeElem.insertBefore(question, themeElem.querySelector('.add-btn'));
    }

    function saveTicket() {
      const ticketData = {
        category: document.getElementById('category').value,
        questions: [],
        answers: []
      };

      const themes = document.querySelectorAll('.theme');
      themes.forEach(theme => {
        const questions = theme.querySelectorAll('.question');
        questions.forEach(question => {
          const questionText = question.querySelector('textarea:first-of-type').value;
          const answerText = question.querySelector('textarea:last-of-type').value;
          ticketData.questions.push(questionText);
          ticketData.answers.push(answerText);
        });
      });

      google.script.run.withSuccessHandler(closeDialog).saveTicket(ticketData);
    }

    function closeDialog() {
      google.script.host.close();
    }
  </script>
</body>
</html>
