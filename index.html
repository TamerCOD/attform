<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аттестация - Билеты</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #fdf6f9, #f3e8f0);
      margin: 0;
      padding: 30px;
      color: #1a1a1a;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #d0006f;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
    }

    .ticket {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 50px;
      box-shadow: 0 10px 30px rgba(208, 0, 111, 0.2), 0 4px 10px rgba(0, 0, 0, 0.05);
      transform: perspective(1200px) rotateX(1deg) rotateY(-1.2deg);
      transition: transform 0.3s ease;
    }

    .ticket:hover {
      transform: perspective(1200px) rotateX(0deg) rotateY(0deg);
    }

    .theme {
      background: #fafafa;
      border-left: 6px solid #d0006f;
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.07);
    }

    .theme input.theme-title {
      font-weight: bold;
      font-size: 17px;
      border: none;
      background: transparent;
      margin-bottom: 12px;
      width: 100%;
      color: #333;
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
    }

    .question {
      margin-top: 12px;
      padding: 14px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e1e1e1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    button {
      background-color: #d0006f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 10px rgba(208, 0, 111, 0.25);
      transition: background-color 0.2s, transform 0.2s;
    }

    button:hover {
      background-color: #ad005d;
      transform: translateY(-2px);
    }

    .done-label {
      font-weight: bold;
      color: #4CAF50;
      margin-top: 12px;
      font-size: 16px;
      text-align: right;
    }

    .global-done {
      display: block;
      margin: 0 auto 30px auto;
      padding: 14px 22px;
      background-color: #4CAF50;
      color: white;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      box-shadow: 0 8px 16px rgba(76, 175, 80, 0.3);
      transition: transform 0.2s;
    }

    .global-done:hover {
      transform: translateY(-2px);
    }

    .add-btn {
      background-color: #555;
      box-shadow: 0 4px 10px rgba(85, 85, 85, 0.3);
    }
  </style>
</head>
<body>
  <h1>Аттестационные Билеты</h1>
  <button class="global-done" onclick="markAllDone()">DONE</button>

  <div id="tickets-container"></div>

  <script>
    const container = document.getElementById('tickets-container');

    for (let b = 1; b <= 3; b++) {
      const ticket = document.createElement('div');
      ticket.className = 'ticket';
      ticket.id = `ticket-${b}`;
      ticket.innerHTML = `<h2>Билет ${b}</h2>`;

      for (let t = 1; t <= 10; t++) {
        const theme = document.createElement('div');
        theme.className = 'theme';
        theme.id = `ticket-${b}-theme-${t}`;

        const themeTitle = document.createElement('input');
        themeTitle.className = 'theme-title';
        themeTitle.placeholder = `Тема №${t} (Введите название темы)`;

        theme.appendChild(themeTitle);

        addQuestionBlock(theme, b, t);

        const addQuestionBtn = document.createElement('button');
        addQuestionBtn.className = 'add-btn';
        addQuestionBtn.textContent = '+ Добавить вопрос';
        addQuestionBtn.onclick = () => addQuestionBlock(theme, b, t);
        theme.appendChild(addQuestionBtn);

        ticket.appendChild(theme);
      }

      container.appendChild(ticket);
    }

    function addQuestionBlock(themeElem, ticketId, themeId) {
      const questions = themeElem.querySelectorAll('.question');
      if (questions.length >= 5) return;

      const question = document.createElement('div');
      question.className = 'question';
      question.innerHTML = `
        <label>Вопрос ${questions.length + 1}</label>
        <textarea rows="3" placeholder="Подробный ответ..."></textarea>
        <div class="points">
          <input type="text" placeholder="Point1">
        </div>
        <button onclick="addPoint(this)">add_POINT</button>
      `;
      themeElem.insertBefore(question, themeElem.querySelector('.add-btn'));
    }

    function addPoint(button) {
      const container = button.previousElementSibling;
      const newPoint = document.createElement('input');
      newPoint.type = 'text';
      newPoint.placeholder = `Дополнительный Point`;
      container.appendChild(newPoint);
    }

    function markAllDone() {
      const tickets = document.querySelectorAll('.ticket');
      tickets.forEach(ticket => {
        if (!ticket.querySelector('.done-label')) {
          const doneLabel = document.createElement('div');
          doneLabel.className = 'done-label';
          doneLabel.textContent = 'Билет оформлен';
          ticket.appendChild(doneLabel);
        }
      });
    }
  </script>
</body>
</html>
