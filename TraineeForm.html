<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; }
      .form-group { margin-bottom: 10px; }
      label { display: block; margin-bottom: 5px; }
      input[type="text"], input[type="date"], select { width: 100%; padding: 8px; box-sizing: border-box; }
      button { padding: 10px 15px; background-color: #4285F4; color: white; border: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>Add New Trainee</h2>
    <div class="form-group">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName">
    </div>
    <div class="form-group">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" name="startDate">
    </div>
    <div class="form-group">
      <label for="mentor">Mentor</label>
      <input type="text" id="mentor" name="mentor">
    </div>
    <div class="form-group">
      <label for="skill">Skill / Direction</label>
      <select id="skill" name="skill"></select>
    </div>
    <button onclick="submitForm()">Add Trainee</button>

    <script>
      // Populate dropdowns with data from the server
      google.script.run.withSuccessHandler(populateSkills).getSkills();

      function populateSkills(skills) {
        const skillSelect = document.getElementById('skill');
        skills.forEach(skill => {
          const option = document.createElement('option');
          option.value = skill;
          option.textContent = skill;
          skillSelect.appendChild(option);
        });
      }

      function submitForm() {
        const traineeData = {
          fullName: document.getElementById('fullName').value,
          startDate: document.getElementById('startDate').value,
          mentor: document.getElementById('mentor').value,
          skill: document.getElementById('skill').value
        };
        google.script.run.withSuccessHandler(closeDialog).addTrainee(traineeData);
      }

      function closeDialog() {
        google.script.host.close();
      }
    </script>
  </body>
</html>
